# Contributor License Agreement check. On a contributor's first pull request the
# bot asks them to sign CLA.md by comment; the check stays red until they do.
# Signatures live on the `cla-signatures` branch, which a release never touches
# (Copybara writes `main` and `release` only). No run: step, so no make target.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
