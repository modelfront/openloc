# CI for every push to main and every pull request. Each run: step is one
# `make ci-<target>`, and nothing else, so the same checks run locally with the
# same command. The browser suites are in e2e.yml, run by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make ci-go
      - run: make ci-types

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make ci-web
      - run: make ci-lint

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # arm64 as well as amd64, the platforms images.yml publishes.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: make ci-images
