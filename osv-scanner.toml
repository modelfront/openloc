# osv-scanner configuration (`make scan-vulns`). Every ignore names the package,
# why it is accepted for now, and an expiry date: when it passes, the check
# fails again. Shipped packages get one month, dev and test tooling three.
# Remove an entry when its package is upgraded.

[[IgnoredVulns]]
id = "GHSA-2j4c-ffch-9f23"
ignoreUntil = 2026-11-12
reason = "github.com/xuri/excelize/v2 2.11.0 ships in the server binary and is fixed only in untagged upstream commits; it stays until a tagged release. The XLSX pre-check and panic recovery (internal/parsers/xlsx/xlsx_open.go) refuse encrypted files, oversized parts and references outside Excel's grid, and turn panics into errors. Memory use up to the 256 MB cap and CPU-burn bugs are not covered: accepted in the dependency-triage ADR."

