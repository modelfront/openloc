paths:
  /jobs/{jobID}/segments:
    parameters:
    - $ref: '#/components/parameters/JobID'
    get:
      operationId: listSegments
      summary: List a job's segments
      description: Source text with its translation in the job's language, in document order. A Linguist
        may read jobs assigned to them.
      tags:
      - Segments
      x-roles: &id001
      - owner
      - admin
      - project_manager
      - linguist
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - name: limit
        in: query
        description: Page size in positions. Defaults to 50; the maximum is 200. The pieces of a split
          segment share one position and always come on the same page, so a page can hold a few more
          segments than the limit.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/SegmentStatus'
      - name: q
        in: query
        description: Text search in the source and the translation.
        schema:
          type: string
      responses:
        '200':
          description: One page of segments.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageInfo'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Segment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /jobs/{jobID}/segments/{translationID}/draft:
    parameters: &id002
    - &id003
      $ref: '#/components/parameters/JobID'
    - &id004
      $ref: '#/components/parameters/TranslationID'
    put:
      operationId: saveSegmentDraft
      summary: Save a draft translation
      description: Saves text without confirming it. The segment goes back to `needs_review`.
      tags:
      - Segments
      x-roles: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentWrite'
      responses:
        '200':
          description: The segment after the save.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SegmentState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /jobs/{jobID}/segments/{translationID}/confirm:
    parameters: *id002
    post:
      operationId: confirmSegment
      summary: Confirm a translation
      description: Approves the segment, as Ctrl+Enter does in the editor, and saves it to the project's
        writable translation memories. Without `text`, confirms the translation as it stands.
      tags:
      - Segments
      x-roles: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentWrite'
      responses:
        '200':
          description: The segment after the confirm.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SegmentState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /jobs/{jobID}/segments/{translationID}/split:
    parameters: *id002
    post:
      operationId: splitSegment
      summary: Split a segment
      description: Cuts the segment in two at `offset`, as Split does in the editor, in this job only;
        the file's other target languages keep the segment whole. The translation stays on the first
        piece and the second piece starts empty; both need review. Pieces share their segment's
        `position` and are ordered by `sub_position`. Refused while the job's task does not take
        edits or pre-translation runs, when the segment is locked, being pre-translated or open by
        someone else, and inside a tag pair.
      tags:
      - Segments
      x-roles: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitSegment'
      responses:
        '200':
          description: The two pieces, in document order.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SegmentEditResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /jobs/{jobID}/segments/join:
    parameters:
    - $ref: '#/components/parameters/JobID'
    post:
      operationId: joinSegments
      summary: Join segments
      description: Joins segments that follow each other in the job into the first one, as Join does in
        the editor, in this job only. It joins the pieces of a split segment, or sentences of one paragraph.
        Joining every piece of a split gives the segment back as it was imported; a sentence split in
        the job joins with its neighbours only with all of its pieces. The first segment keeps its id and gets the
        translations joined in order; the others' comments and history move to it, and they are
        deleted. The result needs review.
      tags:
      - Segments
      x-roles: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinSegments'
      responses:
        '200':
          description: The joined segment.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SegmentEditResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /jobs/{jobID}/segments/{translationID}/comments:
    parameters: *id002
    get:
      operationId: listComments
      summary: List a segment's comments
      description: Oldest first.
      tags:
      - Comments
      x-roles: *id001
      responses:
        '200':
          description: Every comment.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageInfo'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: addComment
      summary: Comment on a segment
      tags:
      - Comments
      x-roles: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              properties:
                content:
                  type: string
                  description: 1 to 5000 characters.
      responses:
        '201':
          description: The new comment.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /jobs/{jobID}/segments/{translationID}/comments/{commentID}:
    parameters:
    - *id003
    - *id004
    - $ref: '#/components/parameters/CommentID'
    delete:
      operationId: deleteComment
      summary: Delete a comment
      description: Your own comment, or one an AI step wrote.
      tags:
      - Comments
      x-roles: *id001
      responses:
        '204':
          description: Done.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  schemas:
    SegmentStatus:
      type: string
      enum:
      - needs_review
      - auto_approved
      - approved
      description: '`needs_review`: waiting for a person. `auto_approved`: approved by quality estimation.
        `approved`: confirmed by a person. Both belong to the current workflow step: when the next
        step starts, every unlocked `approved` and `auto_approved` segment goes back to `needs_review`,
        and when a step is rejected, the reopened step gets back the statuses it ended with, except
        segments a later step rewrote, which come back as `needs_review`. `previous_step` keeps the
        earlier result.'
    Segment:
      type: object
      required:
      - id
      - position
      - sub_position
      - number
      - source_text
      - target_text
      - status
      - origin
      - tm_match_percent
      - updated_at
      - previous_step
      properties:
        id:
          type: integer
          format: int64
          description: Segment id. Use it in the segment routes.
        position:
          type: integer
          description: Position in the document, from 0.
        sub_position:
          type: integer
          description: Orders the pieces of a segment split in the editor, which share its position;
            0 for a segment that was not split and for the first piece.
        number:
          type: string
          description: The segment number the editor shows, for example "3", or "3.1" for the second piece
            of segment 3.
        source_text:
          type: string
        target_text:
          type: string
          nullable: true
          description: The translation; null when there is none yet.
        status:
          $ref: '#/components/schemas/SegmentStatus'
        origin:
          type: string
          enum:
          - tm
          - mt
          - ape
          - file_import
          nullable: true
          description: Where the translation came from.
        tm_match_percent:
          type: integer
          nullable: true
          description: The memory match score, for a translation from translation memory.
        updated_at:
          type: string
          format: date-time
          description: Send it back as `expected_updated_at` to save only if nobody changed the segment
            since.
        previous_step:
          allOf:
          - $ref: '#/components/schemas/StepOutcome'
          nullable: true
          description: How the last finished workflow step left the segment; null before any step has
            finished.
    StepOutcome:
      type: object
      required:
      - step_name
      - step_order
      - step_type
      - round
      - end_reason
      - status
      - ai_outcome
      - edited
      - ended_at
      properties:
        step_name:
          type: string
        step_order:
          type: integer
          description: Position of the step in the workflow, from 0.
        step_type:
          type: string
          enum:
          - human
          - hybrid
          - ai
          - pretranslate
        round:
          type: integer
          description: Which pass through the step, from 1. A step rejected back to runs again as the
            next round.
        end_reason:
          type: string
          enum:
          - completed
          - rejected
          description: '`rejected`: the step was sent back to the one before it.'
        status:
          $ref: '#/components/schemas/SegmentStatus'
        ai_outcome:
          type: string
          enum:
          - approved
          - ape_approved
          - ape_needs_review
          - rejected
          nullable: true
          description: The quality estimation verdict produced in this step, if any.
        edited:
          type: boolean
          description: A person changed the text during the step.
        ended_at:
          type: string
          format: date-time
    SegmentWrite:
      type: object
      properties:
        text:
          type: string
          description: The translation.
        expected_updated_at:
          type: string
          format: date-time
          description: The segment's `updated_at` as you read it. When set, the write fails with 409 if
            the segment changed since.
    SplitSegment:
      type: object
      required:
      - offset
      properties:
        offset:
          type: integer
          example: 16
          description: Where to cut, in UTF-16 code units of the segment's `source_text`. Whitespace
            around it goes between the pieces.
        expected_updated_at:
          type: string
          format: date-time
          description: The segment's `updated_at` as you read it. When it has changed since, the split
            is refused with 409. Leave it out to split whatever the segment holds now.
    JoinSegments:
      type: object
      required:
      - segments
      properties:
        segments:
          type: array
          minItems: 2
          description: The segments to join, which follow each other in the job.
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: integer
                format: int64
              expected_updated_at:
                type: string
                format: date-time
                description: The segment's `updated_at` as you read it; 409 when it has changed since.
    SegmentEditResult:
      type: object
      required:
      - segment_ids
      properties:
        segment_ids:
          type: array
          description: The segments that now stand where the split or joined ones were, in document order.
          items:
            type: integer
            format: int64
    SegmentState:
      type: object
      required:
      - id
      - target_text
      - status
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        target_text:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/SegmentStatus'
        updated_at:
          type: string
          format: date-time
          description: The new version.
    Comment:
      type: object
      required:
      - id
      - content
      - author_id
      - author_name
      - created_at
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
        author_id:
          type: integer
          format: int64
          nullable: true
          description: Null for a comment an AI step wrote.
        author_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
