<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 206" width="700" height="206" role="img" aria-labelledby="t d">
  <title id="t">How a job moves through its steps</title>
  <desc id="d">Completing a step moves the job forward. Rejecting sends it back to the nearest earlier Human or Hybrid step, skipping AI steps because nobody works on them.</desc>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .l { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2937; }
      .b { font: 600 10px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .s { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b7280; }
      .e { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b5563; }
      .er { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #b91c1c; }
      .arw { stroke: #6b7280; stroke-width: 1.5; fill: none; marker-end: url(#g); }
      .arwr { stroke: #b91c1c; stroke-width: 1.5; fill: none; marker-end: url(#r); }
    </style>
  </defs>

  <rect width="700" height="206" fill="#ffffff"/>

  <!-- step 1 -->
  <rect x="20" y="46" width="176" height="64" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="l" x="36" y="72">Translation</text>
  <rect x="36" y="82" width="46" height="17" rx="8" fill="#dbeafe"/>
  <text class="b" x="59" y="94" text-anchor="middle" fill="#1e40af">Human</text>
  <text class="s" x="90" y="94">a linguist</text>

  <!-- step 2 -->
  <rect x="262" y="46" width="176" height="64" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text class="l" x="278" y="72">QE+APE check</text>
  <rect x="278" y="82" width="26" height="17" rx="8" fill="#ede9fe"/>
  <text class="b" x="291" y="94" text-anchor="middle" fill="#5b21b6">AI</text>
  <text class="s" x="312" y="94">Automated</text>

  <!-- step 3 -->
  <rect x="504" y="46" width="176" height="64" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="l" x="520" y="72">Review</text>
  <rect x="520" y="82" width="46" height="17" rx="8" fill="#dbeafe"/>
  <text class="b" x="543" y="94" text-anchor="middle" fill="#1e40af">Human</text>
  <text class="s" x="574" y="94">a reviewer</text>

  <!-- forward -->
  <path class="arw" d="M196,78 H256"/>
  <text class="e" x="229" y="32" text-anchor="middle">Complete step</text>

  <path class="arw" d="M438,78 H498"/>
  <text class="e" x="468" y="32" text-anchor="middle">completes itself</text>

  <!-- reject -->
  <path class="arwr" d="M592,110 V166 H108 V116"/>
  <text class="er" x="350" y="188" text-anchor="middle">Reject — back to the nearest earlier Human or Hybrid step</text>
</svg>
