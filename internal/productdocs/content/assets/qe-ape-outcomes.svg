<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" width="640" height="490" role="img" aria-labelledby="t d">
  <title id="t">The four QE+APE outcomes</title>
  <desc id="d">Three yes/no questions sort every checked segment into one of four outcomes.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .q { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #374151; }
      .o { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .s { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .e { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b7280; }
      .arw { stroke: #6b7280; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <rect width="640" height="490" fill="#ffffff"/>

  <!-- start -->
  <rect x="220" y="14" width="200" height="44" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="q" x="320" y="41" text-anchor="middle">Segment filled by automation</text>
  <path class="arw" d="M320,58 V94"/>

  <!-- Q1 -->
  <polygon points="220,138 320,96 420,138 320,180" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="q" x="320" y="134" text-anchor="middle">Would a professional</text>
  <text class="q" x="320" y="150" text-anchor="middle">accept it as it is?</text>

  <path class="arw" d="M420,138 H464"/>
  <text class="e" x="441" y="130" text-anchor="middle">yes</text>
  <rect x="468" y="106" width="156" height="64" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text class="o" x="546" y="128" text-anchor="middle" fill="#166534">Approved</text>
  <text class="s" x="546" y="145" text-anchor="middle" fill="#166534">text unchanged</text>
  <text class="s" x="546" y="161" text-anchor="middle" fill="#15803d">status: Auto-approved</text>

  <path class="arw" d="M320,180 V234"/>
  <text class="e" x="331" y="210" text-anchor="start">no</text>

  <!-- Q2 -->
  <polygon points="220,276 320,234 420,276 320,318" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="q" x="320" y="280" text-anchor="middle">Is there a rewrite?</text>

  <path class="arw" d="M220,276 H176"/>
  <text class="e" x="198" y="268" text-anchor="middle">no</text>
  <rect x="16" y="244" width="156" height="64" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="o" x="94" y="266" text-anchor="middle" fill="#991b1b">Rejected</text>
  <text class="s" x="94" y="283" text-anchor="middle" fill="#991b1b">original text kept</text>
  <text class="s" x="94" y="299" text-anchor="middle" fill="#b91c1c">status: Draft</text>

  <path class="arw" d="M320,318 V372"/>
  <text class="e" x="331" y="348" text-anchor="start">yes</text>

  <!-- Q3 -->
  <polygon points="220,414 320,372 420,414 320,456" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="q" x="320" y="410" text-anchor="middle">Is the rewrite</text>
  <text class="q" x="320" y="426" text-anchor="middle">good enough?</text>

  <path class="arw" d="M420,414 H464"/>
  <text class="e" x="441" y="406" text-anchor="middle">yes</text>
  <rect x="468" y="382" width="156" height="64" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text class="o" x="546" y="404" text-anchor="middle" fill="#166534">Fixed and approved</text>
  <text class="s" x="546" y="421" text-anchor="middle" fill="#166534">rewrite replaces the text</text>
  <text class="s" x="546" y="437" text-anchor="middle" fill="#15803d">status: Auto-approved</text>

  <path class="arw" d="M220,414 H176"/>
  <text class="e" x="198" y="406" text-anchor="middle">no</text>
  <rect x="16" y="382" width="156" height="64" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="o" x="94" y="404" text-anchor="middle" fill="#991b1b">Fixed, needs review</text>
  <text class="s" x="94" y="421" text-anchor="middle" fill="#991b1b">rewrite replaces the text</text>
  <text class="s" x="94" y="437" text-anchor="middle" fill="#b91c1c">status: Draft</text>
</svg>
